# Steckbrief der Lasttests: Antworten und Festlegungen. Gepflegt über die Seite Last und den Testautor.
# Antworten auf Fragen, die für das Projekt gelten, gelten für jeden Lasttest des Projekts.
tests:
  load/umsatzsuche-unter-last.load.yaml:
    draft:
      title: Umsatzsuche unter Last
      goal: "Hält die Umsatzsuche (PK-73) 300 angemeldete Lastkunden mit je 200 Umsätzen, die mit Betrag von/bis und Kategorie filtern und blättern? Ziel wie NFR-003: 95 % der Aufrufe in höchstens 500 ms, höchstens 0,5 % Serverfehler."
      from: frei
      by: Mandanten Admin
      at: 2026-11-23T20:37:08.627Z
    needs:
      lastmodell:
        value: 300 gleichzeitige Kundinnen, jede virtuelle Nutzerin ist genau ein Lastkunde lasttest-001 bis lasttest-300. Anstieg in 2 Minuten auf 300, 5 Minuten halten, 1 Minute Abbau. Zwischen zwei Anfragen 1 bis 3 Sekunden Denkzeit.
        by: Mandanten Admin
        at: 2026-11-23T20:38:29.214Z
    answers:
      - questionId: ablauf.anfragen
        question: Welche Anfragen soll der Test schicken?
        value: "Je Durchgang: GET /api/konten (IBAN des Girokontos), dann GET /api/konten/{iban}/umsaetze mit betragVon/betragBis und kategorie aus wechselnden Werten, Seite 1 und danach seite=2 und seite=3 derselben Auswahl; jeder zehnte Durchgang zusätzlich GET /api/konten/{iban}/umsaetze/export mit denselben Filtern."
        by: Mandanten Admin
        at: 2026-11-23T20:37:56.933Z
      - questionId: anfragen.anmeldung
        question: Wie meldet sich der Test an?
        value: Anmeldung über POST /api/anmeldung; jeder virtuelle Nutzer meldet sich einmal an und bleibt angemeldet.
        by: Mandanten Admin
        at: 2026-11-23T20:38:00.157Z
      - questionId: randbedingungen.testdaten
        question: Mit welchen Testnutzern meldet sich der Test an?
        value: "Eigene Nutzer je virtuellem Nutzer: lasttest-001 bis lasttest-300 (Kennung aus der VU-Nummer), PIN aus dem Zugang LASTTEST_PIN. Im setup() einmal POST /api/test/lasttest/reset, das gibt jedem Lastkunden 200 Umsätze über sechs Monate."
        by: Mandanten Admin
        at: 2026-11-23T20:39:38.812Z
    questions:
      - id: frage-1
        need: lastmodell
        question: Soll dieser Lasttest auch Überweisungen senden, und in welchem Umfang?
        why: NFR-003 verlangt p95 ≤ 500 ms auch für POST /api/ueberweisungen, aber das Skript sendet diese Anfrage gar nicht — es ist kein bloßer Namensfehler. Betrag, Empfänger und Häufigkeit stehen nicht im Steckbrief; ich möchte sie nicht raten. Die VU-Zahl und die Stages (300, 2/5/1 min) bleiben unverändert, nur der Mix je Durchgang ändert sich.
        options:
          - label: Jeder Durchgang
            detail: Härteste Messung für NFR-003 (viele Messpunkte). 0,10 € ist das API-Minimum; bei ~40 Durchgängen je VU bleibt die Tagessumme weit unter dem Standardlimit von 5.000 €.
            value: In jedem Durchgang nach der Umsatzsuche eine Überweisung über 0,10 € an DE89370400440532013000 mit Tag name ueberweisungen.
            suggested: true
          - label: Jeder zehnte Durchgang
            detail: Weniger Buchungen, dafür deutlich weniger Messpunkte für p95 auf der Überweisung.
            value: Wie der Export nur in jedem zehnten Durchgang eine Überweisung über 0,10 € an DE89370400440532013000 mit Tag name ueberweisungen.
          - label: Eigener Lasttest
            detail: Verschiebt den Zielwert POST /api/ueberweisungen in ein separates Profil; dieser Test misst NFR-003 dann nur für GET /api/konten.
            value: Dieser Test bleibt bei der Umsatzsuche; die Überweisung wird in einem eigenen Lasttest für NFR-003 gemessen.
        by: Testautor
        at: 2026-11-23T21:20:36.684Z
