# Steckbrief der Lasttests: Antworten und Festlegungen. Gepflegt über die Seite Last und den Testautor.
# Antworten auf Fragen, die für das Projekt gelten, gelten für jeden Lasttest des Projekts.
tests:
  load/monatserste-spitze.load.yaml:
    answers:
      - questionId: anfragen.anmeldung
        question: Wie meldet sich der Test an?
        value: Jede VU meldet sich über POST /api/anmeldung mit einem eigenen Lastkunden an (lasttest-001 bis lasttest-300, PIN aus der Umgebungsvariable LASTTEST_PIN, Liste in kundinnen.csv)
        by: Test User One
        at: 2026-11-13T14:09:19.848Z
      - questionId: randbedingungen.aufraeumen
        question: Dürfen Lastläufe Daten auf default liegen lassen?
        value: Es gibt einen Reset, die Beschreibung liegt im Kontext.
        by: Test User One
        at: 2026-11-13T14:09:30.164Z
      - questionId: randbedingungen.testdaten
        question: Reichen die Testnutzer für 300 gleichzeitige Nutzer?
        value: Jeder virtuelle Nutzer bekommt eigene Zugangsdaten; die Liste liegt als CSV im Kontext.
        by: Test User One
        at: 2026-11-13T14:09:46.518Z
    needs:
      anfragen:
        value: 'POST /api/anmeldung nimmt JSON {"kennung", "pin"} und setzt das HttpOnly-Cookie aventa_sitzung; alle /api-Aufrufe brauchen dieses Cookie, sonst 401. GET /anmelden liefert nur die HTML-Seite mit dem Formular. anmeldung-formular ist kein Topic, sondern der Rückfallweg des Skripts: das Formular der Anmeldeseite per HTTP POST. POST /api/test/lasttest/reset (ohne Rumpf, 204) setzt die Lastkunden zurück.'
        by: Test User One
        at: 2026-11-13T14:11:12.623Z
