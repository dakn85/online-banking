# Lastprofil der Monatsersten-Spitze: misst NFR-003 und NFR-004 im selben Lauf mit
# load/monatserste-spitze.js.
# Das Lastniveau steht im Skript (300 gleichzeitig angemeldete Kundinnen, rund 20 Finanzstatus-Aufrufe
# je Sekunde, jede zehnte Überweisung, 15 Minuten Beharrungszustand), hier nur Werkzeug und Zuordnung.
#
# NFR-003 (Antwortzeit ≥ 95 % ≤ 500 ms): http_req_duration p(95) auf finanzstatus und ueberweisung.
# NFR-004 (Verfügbarkeit ≥ 99,5 % ohne 5xx): http_req_failed auf finanzstatus und ueberweisung, wobei
# 4xx als fachliche Ablehnung als Erfolg zählt (erwartete Antworten 200–499, Fehler nur 5xx).
tool: k6
script: load/monatserste-spitze.js
# proof: false, weil heute nur der Demo-Zugang aus load/data/kundinnen.csv zur Verfügung steht; alle 300
# VUs arbeiten also als dieselbe Kundin. Nachweis erst mit 300 eigenen Testkundinnen.
proof: false
measures:
  - nfr: NFR-003
  - nfr: NFR-004
