<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aventa Bank</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/assets/marke.js"></script>
</head>
<body>
  <div class="rahmen">
    <aside class="leiste">
      <a class="marke" href="/finanzstatus"><span id="zeichen"></span><span class="marke__name">Aventa Bank<small>Online-Banking</small></span></a>
      <nav class="navigation" aria-label="Hauptnavigation">
        <a href="/finanzstatus" data-seite="/finanzstatus">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 16.5h14M5 13.5V9M10 13.5V5M15 13.5v-6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          Finanzstatus
        </a>
        <a href="/ueberweisung" data-seite="/ueberweisung">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 7h12m-3.5-3.5L15.5 7 12 10.5M16.5 13h-12M8 9.5 4.5 13 8 16.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Überweisung
        </a>
      </nav>
      <div class="leiste__kunde">
        <strong id="kunde-name"></strong>
        <span id="kunde-nummer"></span>
        <button type="button" id="abmelden">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2.5H3.5v11H6M10 5l3 3-3 3M13 8H6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Abmelden
        </button>
      </div>
    </aside>
    <main class="inhalt">
      <header class="inhalt__kopf">
        <div>
          <h1 id="seitentitel"></h1>
          <p id="begruessung"></p>
        </div>
        <div id="kopf-aktion"></div>
      </header>
      <div class="inhalt__flaeche" id="seite"></div>
    </main>
  </div>
  <script src="/assets/app.js"></script>
  <script src="/assets/seiten/finanzstatus.js"></script>
</body>
</html>
