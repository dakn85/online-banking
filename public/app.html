<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aventa Bank</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/assets/marke.js"></script>
</head>
<body>
  <div class="rahmen">
    <aside class="leiste" aria-label="Seitenleiste">
      <div class="leiste__kopf">
        <a class="marke" href="/finanzstatus"><span id="zeichen"></span><span class="marke__name">Aventa Bank<small>Online-Banking</small></span></a>
        <button type="button" class="leiste__menue" id="menue" aria-expanded="false" aria-controls="hauptnavigation">
          <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M4 6.5h14M4 11h14M4 15.5h14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <span class="unsichtbar">Menü</span>
        </button>
      </div>
      <nav class="navigation" id="hauptnavigation" aria-label="Hauptnavigation">
        <div class="navigation__gruppe">
          <a href="/finanzstatus" data-seite="/finanzstatus">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 16.5h14M5 13.5V9M10 13.5V5M15 13.5v-6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Finanzstatus
          </a>
        </div>
        <div class="navigation__gruppe" role="group" aria-labelledby="gruppe-zahlungen">
          <p class="navigation__titel" id="gruppe-zahlungen">Zahlungen</p>
          <a href="/ueberweisung" data-seite="/ueberweisung">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 7h12m-3.5-3.5L15.5 7 12 10.5M16.5 13h-12M8 9.5 4.5 13 8 16.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Überweisung
          </a>
          <a href="/umbuchung" data-seite="/umbuchung">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 3.5v13M6 16.5 3.5 14M6 16.5 8.5 14M14 16.5v-13M14 3.5 11.5 6M14 3.5 16.5 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Umbuchung
          </a>
          <a href="/dauerauftraege" data-seite="/dauerauftraege">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10a6 6 0 1 1-1.8-4.3M16 3.5v3h-3M10 7v3.2l2 1.3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Daueraufträge
          </a>
          <a href="/empfaengervorlagen" data-seite="/empfaengervorlagen">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 3.5h9.5L16 6v10.5H4zM7 8h6M7 11h6M7 14h3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Empfängervorlagen
          </a>
        </div>
        <div class="navigation__gruppe" role="group" aria-labelledby="gruppe-service">
          <p class="navigation__titel" id="gruppe-service">Service</p>
          <a href="/postfach" data-seite="/postfach">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 5.5h13v9h-13zM3.5 6l6.5 5 6.5-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Postfach<span class="navigation__zahl" id="postfach-zahl" hidden></span>
          </a>
          <a href="/tageslimit" data-seite="/tageslimit">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 15.5a6.5 6.5 0 1 1 13 0M10 15.5l3-4.5M3.5 15.5h13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Tageslimit
          </a>
          <a href="/persoenliche-daten" data-seite="/persoenliche-daten">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 9.5a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM4 16.5c.8-3 3.2-4.5 6-4.5s5.2 1.5 6 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Persönliche Daten
          </a>
        </div>
      </nav>
      <div class="leiste__kunde">
        <span class="leiste__kuerzel" id="kunde-kuerzel" aria-hidden="true"></span>
        <div class="leiste__person">
          <strong id="kunde-name"></strong>
          <span id="kunde-nummer"></span>
        </div>
        <button type="button" id="abmelden">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2.5H3.5v11H6M10 5l3 3-3 3M13 8H6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Abmelden
        </button>
      </div>
    </aside>
    <main class="inhalt">
      <header class="inhalt__kopf">
        <div>
          <p id="begruessung"></p>
          <h1 id="seitentitel"></h1>
        </div>
        <div id="kopf-aktion"></div>
      </header>
      <div class="inhalt__flaeche" id="seite"></div>
    </main>
  </div>
  <script src="/assets/app.js"></script>
  <script src="/assets/seiten/finanzstatus.js"></script>
  <script src="/assets/seiten/ueberweisung.js"></script>
  <script src="/assets/seiten/umbuchung.js"></script>
  <script src="/assets/seiten/umsaetze.js"></script>
  <script src="/assets/seiten/empfaengervorlagen.js"></script>
  <script src="/assets/seiten/tageslimit.js"></script>
  <script src="/assets/seiten/dauerauftraege.js"></script>
  <script src="/assets/seiten/vorgemerkte-ueberweisungen.js"></script>
  <script src="/assets/seiten/debitkarte.js"></script>
  <script src="/assets/seiten/ausgabenanalyse.js"></script>
  <script src="/assets/seiten/postfach.js"></script>
  <script src="/assets/seiten/kontoauszug.js"></script>
  <script src="/assets/seiten/persoenliche-daten.js"></script>
</body>
</html>
