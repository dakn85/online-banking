<header data-wf="kopf">
  <h1>Kontoauszug</h1>
  <p>Laden Sie den Kontoauszug eines Kontos für einen Monat als PDF herunter.</p>
</header>
<form data-wf="formular">
  <label data-wf="feld"><span>Konto</span><select name="konto"><option>Girokonto</option><option>Kreditkarte</option></select></label>
  <label data-wf="feld"><span>Monat</span><input name="monat" placeholder="2026-02" required></label>
  <div data-wf="aktionen"><button data-wf="primaer">Kontoauszug herunterladen</button></div>
</form>
<p data-wf="meldung" role="alert">Der Monat ist ungültig: JJJJ-MM, höchstens der laufende Monat.</p>
<p data-wf="meldung" role="alert">Das Konto wurde nicht gefunden.</p>
