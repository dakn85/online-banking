<header data-wf="kopf">
  <h1>Überweisung</h1>
  <p>Einmalige Überweisung von Ihrem Girokonto.</p>
</header>
<nav data-wf="navigation">
  <a href="#">Finanzstatus</a>
  <a href="#" aria-current="page">Überweisung</a>
</nav>
<p data-wf="meldung" role="alert">Der Betrag übersteigt den verfügbaren Betrag des Girokontos.</p>
<p data-wf="meldung" role="alert">Die IBAN ist ungültig oder gehört zu keinem SEPA-Land.</p>
<form data-wf="formular">
  <h2>Empfänger und Betrag</h2>
  <label data-wf="feld"><span>Auftraggeberkonto</span><input name="auftraggeberkonto" placeholder="Girokonto · DE02 5001 0517 5407 3249 31"></label>
  <label data-wf="feld"><span>Verfügbarer Betrag</span><input name="verfuegbarerBetrag" placeholder="3.145,30"></label>
  <label data-wf="feld"><span>Empfänger</span><input name="empfaenger" placeholder="Möbel Nord GmbH" required></label>
  <label data-wf="feld"><span>IBAN des Empfängers</span><input name="empfaengerIban" placeholder="DE02 5001 0517 5407 3249 31" required></label>
  <label data-wf="feld"><span>Betrag in Euro</span><input type="number" step="0.01" name="betrag" placeholder="50,00" required></label>
  <label data-wf="feld"><span>Verwendungszweck</span><textarea name="verwendungszweck" placeholder="Rechnung 4711" required></textarea></label>
  <div data-wf="aktionen">
    <button data-wf="primaer">Weiter</button>
    <button>Abbrechen</button>
  </div>
</form>
