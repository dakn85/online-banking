openapi: 3.1.0
info:
  title: Online-Banking
  version: 0.1.0
paths: { /api/konten: { get: { description: "Liefert die Konten der angemeldeten Kundin für den Finanzstatus. Ohne gültige Sitzung antwortet der Dienst mit 401; die Seite selbst leitet auf die Anmeldeseite um. Beträge in Euro, negative Salden (Kreditkarte mit offenem Betrag) als negative Zahl. Dispositionsrahmen und verfügbarer Betrag nur beim Girokonto.", operationId: kontenLesen, responses: { "200": { content: { application/json: { schema: { $ref: '#/components/schemas/Kontenuebersicht' } } }, description: Konten der Kundin mit Gesamtvermögen }, "401": { content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } }, description: Keine gültige Sitzung }, "500": { content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } }, description: Datenfehler; ein Girokonto ohne Dispositionsrahmen } }, summary: Konten der angemeldeten Kundin mit Salden und Gesamtvermögen, tags: [ Finanzstatus ], x-use-cases: [ UC-001 ] } }, /api/ueberweisungen: { post: { description: "Legt den Überweisungsauftrag an und führt ihn genau einmal aus. Die IBAN des Empfängers muss gültig sein und zu einem SEPA-Land gehören, der Betrag darf den verfügbaren Betrag des Girokontos nicht übersteigen; sonst wird nichts gebucht. Das Auftraggeberkonto ist ein Girokonto der angemeldeten Kundin. Eine wiederholte Bestätigung mit derselben auftragsId bucht nicht erneut. Beträge in Euro.", operationId: ueberweisungAusfuehren, requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Ueberweisungsauftrag' } } }, required: true }, responses: { "200": { content: { application/json: { schema: { $ref: '#/components/schemas/Ueberweisung' } } }, description: Auftrag mit dieser auftragsId war bereits ausgeführt; keine weitere Buchung }, "201": { content: { application/json: { schema: { $ref: '#/components/schemas/Ueberweisung' } } }, description: "Auftrag ausgeführt, Saldo des Girokontos gemindert" }, "400": { content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } }, description: "IBAN ungültig oder gehört zu keinem SEPA-Land" }, "401": { content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } }, description: Keine gültige Sitzung }, "403": { content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } }, description: Auftraggeberkonto gehört nicht zu einem Girokonto der angemeldeten Kundin }, "422": { content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } }, description: Betrag nicht größer als 0 oder übersteigt den verfügbaren Betrag des Girokontos } }, summary: Überweisung vom Girokonto ausführen, tags: [ Überweisung ], x-use-cases: [ UC-002 ] } }, "/api/konten/{iban}/umsaetze": { get: { description: "Liefert die Umsätze des Kontos mit dieser IBAN, den neuesten zuerst (BR-0008): sortiert nach Buchungstag absteigend, bei gleichem Buchungstag nach gebuchtAm absteigend. Ohne gültige Sitzung antwortet der Dienst mit 401; eine IBAN, die zu keinem Konto der angemeldeten Kundin gehört, mit 404 (BR-0011). Beträge in Euro, Ausgänge als negative Zahl. Suche und Filter wertet der Dienst aus: suchtext trifft Gegenpartei oder Verwendungszweck ohne Rücksicht auf Groß- und Kleinschreibung, von und bis begrenzen den Buchungstag, beide Grenzen eingeschlossen, richtung wählt Ein- oder Ausgang nach dem Vorzeichen des Betrags; ein fehlender Parameter schränkt nicht ein (BR-0009, BR-0010). Liegt von nach dem bis, antwortet der Dienst mit 400 und dem Feld fehler „Der Zeitraum ist ungültig: von liegt nach bis.“ und liefert keine Umsätze (BR-0010).", operationId: umsaetzeLesen, parameters: [ { description: IBAN des Kontos der Kundin, in: path, name: iban, required: true, schema: { type: string } }, { description: "Nur Umsätze, deren Gegenpartei oder Verwendungszweck den Suchtext enthält, ohne Rücksicht auf Groß- und Kleinschreibung (BR-0010)", in: query, name: suchtext, required: false, schema: { type: string } }, { description: "Nur Umsätze mit Buchungstag ab diesem Tag, einschließlich (BR-0010); liegt dieser Tag nach dem Bis-Datum, antwortet der Dienst mit 400", in: query, name: von, required: false, schema: { format: date, type: string } }, { description: "Nur Umsätze mit Buchungstag bis zu diesem Tag, einschließlich (BR-0010)", in: query, name: bis, required: false, schema: { format: date, type: string } }, { description: Nur Umsätze mit positivem (eingang) oder negativem (ausgang) Betrag; alle schränkt nicht ein (BR-0009), in: query, name: richtung, required: false, schema: { default: alle, enum: [ alle, eingang, ausgang ], type: string } } ], responses: { "200": { content: { application/json: { schema: { $ref: '#/components/schemas/Umsaetze' } } }, description: "Umsätze des Kontos, neueste zuerst, nach den Abfrageparametern gefiltert" }, "400": { content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } }, description: "Abfrageparameter ungültig, etwa ein Datum nicht im Format JJJJ-MM-TT, eine unbekannte Richtung oder ein Von-Datum nach dem Bis-Datum (BR-0010)" }, "401": { content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } }, description: Keine gültige Sitzung }, "404": { content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } }, description: Die IBAN gehört zu keinem Konto der Kundin } }, summary: "Umsätze eines Kontos mit Saldo danach, neueste zuerst", tags: [ Finanzstatus ], x-use-cases: [ UC-003 ] } }, /api/empfaengervorlagen: { get: { summary: Empfängervorlagen der angemeldeten Kundin, description: "Liefert die Empfängervorlagen der angemeldeten Kundin, nach Name aufsteigend. Ohne gültige Sitzung antwortet der Dienst mit 401; die Seite selbst leitet auf die Anmeldeseite um. Der Verwendungszweck fehlt, wenn die Vorlage keinen hat.", operationId: empfaengervorlagenAuflisten, tags: [ Überweisung ], responses: { "200": { description: "Empfängervorlagen der Kundin, nach Name aufsteigend", content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Empfaengervorlage' } } } } }, "401": { description: Keine gültige Sitzung, content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } } } }, x-use-cases: [ UC-004 ] }, post: { summary: Empfängervorlage anlegen, description: "Legt eine Empfängervorlage der angemeldeten Kundin an. Der Name ist Pflicht und je Kundin eindeutig, die IBAN muss gültig sein und zu einem SEPA-Land gehören (BR-0003), der Verwendungszweck ist optional; ist er leer oder enthält er nur Leerzeichen, speichert der Dienst keinen Wert und das Feld verwendungszweck fehlt in der Antwort und in der Liste; eine Kundin hat höchstens 50 Empfängervorlagen. Den Namen vergleicht der Dienst auf Eindeutigkeit ohne führende und folgende Leerzeichen und ohne Beachtung der Groß-/Kleinschreibung; gespeichert und angezeigt wird die Eingabe der Kundin. Ohne gültige Sitzung antwortet der Dienst mit 401. Danach prüft er in dieser Reihenfolge: Pflicht und Format (400), die Eindeutigkeit des Namens (409), zuletzt die Höchstzahl (422); ein vergebener Name ergibt auch bei 50 Vorlagen 409 mit „Eine Vorlage mit diesem Namen gibt es bereits.“", operationId: empfaengervorlageAnlegen, tags: [ Überweisung ], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NeueEmpfaengervorlage' } } } }, responses: { "201": { description: Vorlage angelegt, content: { application/json: { schema: { $ref: '#/components/schemas/Empfaengervorlage' } } } }, "400": { description: "Name fehlt oder ist länger als 70 Zeichen, Verwendungszweck länger als 140 Zeichen, IBAN ungültig oder gehört zu keinem SEPA-Land; wird vor der Eindeutigkeit und der Höchstzahl geprüft", content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } } }, "401": { description: Keine gültige Sitzung, content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } } }, "409": { description: "Eine Vorlage mit diesem Namen gibt es bei dieser Kundin bereits, auch wenn sich der Name nur in der Groß-/Kleinschreibung oder in führenden oder folgenden Leerzeichen unterscheidet; die bestehende Vorlage bleibt unverändert. Wird vor der Höchstzahl geprüft, gilt also auch, wenn die Kundin schon 50 Vorlagen hat", content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } } }, "422": { description: "Höchstzahl von 50 Empfängervorlagen erreicht; bestehende Vorlagen bleiben unverändert. Wird zuletzt geprüft, nur wenn Pflicht, Format und Eindeutigkeit in Ordnung sind", content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } } } }, x-use-cases: [ UC-004 ] } }, "/api/empfaengervorlagen/{vorlagenId}": { patch: { summary: Empfängervorlage umbenennen, description: "Ändert nur den Namen der Vorlage; IBAN des Empfängers und Verwendungszweck bleiben. Der neue Name ist Pflicht und je Kundin eindeutig; die Eindeutigkeitsprüfung schließt die umbenannte Vorlage selbst aus, sodass ein Name, den die Vorlage nach dem Vergleich schon trägt, kein Konflikt ist und der Dienst mit 200 antwortet. Den Namen vergleicht der Dienst auch hier ohne führende und folgende Leerzeichen und ohne Beachtung der Groß-/Kleinschreibung; gespeichert und angezeigt wird die Eingabe der Kundin. Eine unbekannte Vorlagen-Kennung oder eine Vorlage einer anderen Kundin beantwortet der Dienst mit 404, ohne gültige Sitzung mit 401.", operationId: empfaengervorlageUmbenennen, tags: [ Überweisung ], parameters: [ { name: vorlagenId, in: path, required: true, description: Kennung der Empfängervorlage, schema: { type: string, minLength: 1, maxLength: 36 } } ], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EmpfaengervorlageName' } } } }, responses: { "200": { description: "Vorlage umbenannt; gespeichert und angezeigt wird die Eingabe der Kundin", content: { application/json: { schema: { $ref: '#/components/schemas/Empfaengervorlage' } } } }, "400": { description: Name fehlt oder ist länger als 70 Zeichen, content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } } }, "401": { description: Keine gültige Sitzung, content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } } }, "404": { description: Keine Vorlage der Kundin mit dieser Kennung, content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } } }, "409": { description: "Eine andere Vorlage mit diesem Namen gibt es bei dieser Kundin bereits, auch wenn sich der Name nur in der Groß-/Kleinschreibung oder in führenden oder folgenden Leerzeichen unterscheidet; die bestehende Vorlage bleibt unverändert", content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } } } }, x-use-cases: [ UC-004 ] }, delete: { summary: Empfängervorlage löschen, description: "Löscht die Empfängervorlage der angemeldeten Kundin; eine bereits bestätigte Überweisung bleibt unberührt. Eine unbekannte Vorlagen-Kennung oder eine Vorlage einer anderen Kundin beantwortet der Dienst mit 404, ohne gültige Sitzung mit 401.", operationId: empfaengervorlageLoeschen, tags: [ Überweisung ], parameters: [ { name: vorlagenId, in: path, required: true, description: Kennung der Empfängervorlage, schema: { type: string, minLength: 1, maxLength: 36 } } ], responses: { "204": { description: Vorlage gelöscht }, "401": { description: Keine gültige Sitzung, content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } } }, "404": { description: Keine Vorlage der Kundin mit dieser Kennung, content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } } } }, x-use-cases: [ UC-004 ] } }, /api/dauerauftraege: { get: { summary: Daueraufträge der angemeldeten Kundin, description: "Liefert die Daueraufträge der angemeldeten Kundin mit Empfänger, IBAN des Empfängers, Betrag in Euro, Ausführungstag im Monat, erster Ausführung und Verwendungszweck, nach erster Ausführung aufsteigend. Ohne gültige Sitzung antwortet der Dienst mit 401; die Seite selbst leitet auf die Anmeldeseite um.", operationId: dauerauftraegeAuflisten, tags: [ Dauerauftrag ], responses: { "200": { description: "Daueraufträge der Kundin, nach erster Ausführung aufsteigend", content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Dauerauftrag' } } } } }, "401": { description: Keine gültige Sitzung, content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } } } }, x-use-cases: [ UC-005 ] }, post: { summary: Dauerauftrag einrichten, description: "Legt einen monatlichen Dauerauftrag vom Girokonto der angemeldeten Kundin an. Die IBAN des Empfängers muss gültig sein und zu einem SEPA-Land gehören, der Betrag mindestens 0.01 Euro betragen, der Ausführungstag im Monat zwischen 1 und 28 liegen und die erste Ausführung darf nicht in der Vergangenheit liegen; sonst wird nichts angelegt. Heute ist dabei der Kalendertag in UTC (BR-0023). Der Betrag wird beim Anlegen nicht mit dem verfügbaren Betrag des Girokontos verglichen. Beträge in Euro.", operationId: dauerauftragAnlegen, tags: [ Dauerauftrag ], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DauerauftragAnlegen' } } } }, responses: { "201": { description: Dauerauftrag angelegt, content: { application/json: { schema: { $ref: '#/components/schemas/Dauerauftrag' } } } }, "400": { description: "IBAN ungültig oder gehört zu keinem SEPA-Land, Betrag kleiner als 0.01, Ausführungstag außerhalb von 1 bis 28 oder erste Ausführung vor dem heutigen Tag (Kalendertag in UTC)", content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } } }, "401": { description: Keine gültige Sitzung, content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } } }, "403": { description: Auftraggeberkonto gehört nicht zu einem Girokonto der angemeldeten Kundin, content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } } } }, x-use-cases: [ UC-005 ] } }, "/api/dauerauftraege/{dauerauftragsId}": { delete: { summary: Dauerauftrag löschen, description: "Löscht den Dauerauftrag der angemeldeten Kundin; bestehende Umsätze des Girokontos bleiben unberührt. Eine unbekannte Dauerauftrags-Kennung oder ein Dauerauftrag einer anderen Kundin wird mit 404 beantwortet, ohne gültige Sitzung mit 401.", operationId: dauerauftragLoeschen, tags: [ Dauerauftrag ], parameters: [ { name: dauerauftragsId, in: path, required: true, description: Kennung des Dauerauftrags, schema: { type: string, minLength: 1, maxLength: 36 } } ], responses: { "204": { description: Dauerauftrag gelöscht }, "401": { description: Keine gültige Sitzung, content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } } }, "404": { description: Kein Dauerauftrag der Kundin mit dieser Kennung, content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } } } }, x-use-cases: [ UC-005 ] } } }
components:
  schemas:
    Fehler:
      properties:
        fehler:
          type: string
      required:
        - fehler
      type: object
    Konto:
      properties:
        art:
          enum:
            - Girokonto
            - Kreditkarte
          type: string
        dispositionsrahmen:
          description: Dispositionsrahmen in Euro; nur beim Girokonto vorhanden
          type: number
        iban:
          description: IBAN des Kontos
          type: string
        kontoname:
          description: Bezeichnung des Kontos
          type: string
        saldo:
          description: Saldo in Euro; negativ bei einer Kreditkarte mit offenem Betrag
          type: number
        waehrung:
          enum:
            - EUR
          type: string
        verfuegbarerBetrag:
          type: number
          description: Verfügbarer Betrag in Euro (Saldo plus Dispositionsrahmen); nur beim Girokonto vorhanden
      required:
        - kontoname
        - iban
        - art
        - saldo
        - waehrung
      type: object
      x-entity: Konto
    Kontenuebersicht:
      properties:
        gesamtvermoegen:
          description: Summe der Salden aller Konten in Euro
          type: number
        konten:
          items:
            $ref: '#/components/schemas/Konto'
          type: array
      required:
        - konten
        - gesamtvermoegen
      type: object
    Ueberweisung:
      properties:
        auftragsId:
          type: string
        auftraggeberIban:
          type: string
        betrag:
          type: number
        empfaenger:
          type: string
        empfaengerIban:
          type: string
        erfasstAm:
          format: date-time
          type: string
        status:
          enum:
            - ausgefuehrt
          type: string
        verwendungszweck:
          type: string
        waehrung:
          enum:
            - EUR
          type: string
      required:
        - auftragsId
        - betrag
        - waehrung
        - status
        - erfasstAm
      type: object
      x-entity: Überweisung
    Ueberweisungsauftrag:
      properties:
        auftraggeberIban:
          description: IBAN des Girokontos der Kundin
          maxLength: 22
          minLength: 22
          type: string
        auftragsId:
          description: Kennung des Auftrags, von der Seite je Überweisung vergeben; wiederholte Bestätigung mit derselben Kennung bucht nicht erneut
          maxLength: 36
          minLength: 1
          type: string
        betrag:
          description: Betrag in Euro; höchstens der verfügbare Betrag des Girokontos
          exclusiveMinimum: 0
          type: number
        empfaenger:
          maxLength: 70
          minLength: 1
          type: string
        empfaengerIban:
          description: IBAN des Empfängers; Länderkennzeichen muss in der SEPA-Länderliste stehen
          maxLength: 34
          minLength: 15
          type: string
        verwendungszweck:
          maxLength: 140
          minLength: 1
          type: string
        waehrung:
          default: EUR
          enum:
            - EUR
          type: string
      required:
        - auftragsId
        - auftraggeberIban
        - empfaenger
        - empfaengerIban
        - betrag
        - verwendungszweck
      type: object
    Umsaetze:
      properties:
        umsaetze:
          items:
            $ref: '#/components/schemas/Umsatz'
          type: array
      required:
        - umsaetze
      type: object
    Umsatz:
      properties:
        betrag:
          description: Betrag in Euro; beim Ausgang negativ
          type: number
        buchungstag:
          description: Tag der Buchung
          format: date
          type: string
        gegenpartei:
          description: Name der Gegenpartei
          type: string
        saldoDanach:
          description: Saldo des Kontos nach dieser Buchung in Euro
          type: number
        verwendungszweck:
          description: Verwendungszweck der Buchung
          type: string
        waehrung:
          enum:
            - EUR
          type: string
        gebuchtAm:
          description: Zeitpunkt der Buchung in UTC; bei gleichem Buchungstag der jüngere Umsatz zuerst (BR-0008)
          format: date-time
          type: string
      required:
        - buchungstag
        - gebuchtAm
        - gegenpartei
        - verwendungszweck
        - betrag
        - waehrung
        - saldoDanach
      type: object
      x-entity: Umsatz
    Empfaengervorlage:
      type: object
      properties:
        vorlagenId:
          type: string
        name:
          description: Name des Empfängers, der zugleich die Vorlage benennt; gespeichert und angezeigt wie von der Kundin eingegeben
          maxLength: 70
          minLength: 1
          type: string
        empfaengerIban:
          description: IBAN des Empfängers; Länderkennzeichen muss in der SEPA-Länderliste stehen (BR-0003)
          maxLength: 34
          minLength: 15
          type: string
        verwendungszweck:
          description: Verwendungszweck der Vorlage; fehlt, wenn die Vorlage keinen hat, also leer oder nur Leerzeichen
          maxLength: 140
          type: string
      required:
        - vorlagenId
        - name
        - empfaengerIban
      x-entity: Empfaengervorlage
    NeueEmpfaengervorlage:
      type: object
      properties:
        name:
          description: Name des Empfängers, der zugleich die Vorlage benennt; je Kundin eindeutig, verglichen ohne führende und folgende Leerzeichen und ohne Beachtung der Groß-/Kleinschreibung; gespeichert und angezeigt wird die Eingabe der Kundin
          maxLength: 70
          minLength: 1
          type: string
        empfaengerIban:
          description: IBAN des Empfängers; Länderkennzeichen muss in der SEPA-Länderliste stehen (BR-0003)
          maxLength: 34
          minLength: 15
          type: string
        verwendungszweck:
          description: Verwendungszweck der Vorlage; optional; leer oder nur Leerzeichen bedeutet kein Verwendungszweck, dann speichert der Dienst keinen Wert und das Feld fehlt in der Antwort und in der Liste
          maxLength: 140
          type: string
      required:
        - name
        - empfaengerIban
    EmpfaengervorlageName:
      type: object
      properties:
        name:
          description: |-
            Neuer Name des Empfängers; je Kundin eindeutig, verglichen mit den anderen
                      Vorlagen der Kundin ohne führende und folgende Leerzeichen und ohne
                      Beachtung der Groß-/Kleinschreibung; der eigene Name der Vorlage ist
                      kein Konflikt; gespeichert und angezeigt wird die Eingabe der Kundin
          maxLength: 70
          minLength: 1
          type: string
      required:
        - name
    Dauerauftrag:
      type: object
      properties:
        dauerauftragsId:
          type: string
        auftraggeberIban:
          type: string
        empfaenger:
          type: string
        empfaengerIban:
          type: string
        betrag:
          type: number
        waehrung:
          type: string
          enum:
            - EUR
        ausfuehrungstag:
          type: integer
        ersteAusfuehrung:
          type: string
          format: date
        verwendungszweck:
          type: string
      required:
        - dauerauftragsId
        - auftraggeberIban
        - empfaenger
        - empfaengerIban
        - betrag
        - waehrung
        - ausfuehrungstag
        - ersteAusfuehrung
        - verwendungszweck
      x-entity: Dauerauftrag
    DauerauftragAnlegen:
      type: object
      properties:
        auftraggeberIban:
          type: string
          description: IBAN des Girokontos der Kundin
          minLength: 22
          maxLength: 22
        empfaenger:
          type: string
          minLength: 1
          maxLength: 70
        empfaengerIban:
          type: string
          description: IBAN des Empfängers; Länderkennzeichen muss in der SEPA-Länderliste stehen (BR-0003)
          minLength: 15
          maxLength: 34
        betrag:
          type: number
          description: Betrag je Ausführung in Euro; mindestens 0.01 (BR-0021)
          exclusiveMinimum: 0
          minimum: 0.01
        waehrung:
          type: string
          enum:
            - EUR
          default: EUR
        ausfuehrungstag:
          type: integer
          description: Tag im Monat, an dem der Dauerauftrag ausgeführt wird
          minimum: 1
          maximum: 28
        ersteAusfuehrung:
          type: string
          format: date
          description: Datum der ersten Ausführung; nicht vor dem heutigen Tag, dem Kalendertag in UTC (BR-0023)
        verwendungszweck:
          type: string
          minLength: 1
          maxLength: 140
      required:
        - auftraggeberIban
        - empfaenger
        - empfaengerIban
        - betrag
        - ausfuehrungstag
        - ersteAusfuehrung
        - verwendungszweck
