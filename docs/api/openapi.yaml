openapi: 3.1.0
info:
  title: Online-Banking
  version: 0.1.0
paths: { /api/konten: { get: { description: "Liefert die Konten der angemeldeten Kundin für den Finanzstatus. Ohne gültige Sitzung antwortet der Dienst mit 401; die Seite selbst leitet auf die Anmeldeseite um. Beträge in Euro, negative Salden (Kreditkarte mit offenem Betrag) als negative Zahl. Dispositionsrahmen und verfügbarer Betrag nur beim Girokonto.", operationId: kontenLesen, responses: { "200": { content: { application/json: { schema: { $ref: '#/components/schemas/Kontenuebersicht' } } }, description: Konten der Kundin mit Gesamtvermögen }, "401": { content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } }, description: Keine gültige Sitzung }, "500": { content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } }, description: Datenfehler; ein Girokonto ohne Dispositionsrahmen } }, summary: Konten der angemeldeten Kundin mit Salden und Gesamtvermögen, tags: [ Finanzstatus ], x-use-cases: [ UC-001 ] } }, /api/ueberweisungen: { post: { description: "Legt den Überweisungsauftrag an und führt ihn genau einmal aus. Die IBAN des Empfängers muss gültig sein und zu einem SEPA-Land gehören, der Betrag darf den verfügbaren Betrag des Girokontos nicht übersteigen; sonst wird nichts gebucht. Das Auftraggeberkonto ist ein Girokonto der angemeldeten Kundin. Eine wiederholte Bestätigung mit derselben auftragsId bucht nicht erneut. Beträge in Euro.", operationId: ueberweisungAusfuehren, requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Ueberweisungsauftrag' } } }, required: true }, responses: { "200": { content: { application/json: { schema: { $ref: '#/components/schemas/Ueberweisung' } } }, description: Auftrag mit dieser auftragsId war bereits ausgeführt; keine weitere Buchung }, "201": { content: { application/json: { schema: { $ref: '#/components/schemas/Ueberweisung' } } }, description: "Auftrag ausgeführt, Saldo des Girokontos gemindert" }, "400": { content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } }, description: "IBAN ungültig oder gehört zu keinem SEPA-Land" }, "401": { content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } }, description: Keine gültige Sitzung }, "403": { content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } }, description: Auftraggeberkonto gehört nicht zu einem Girokonto der angemeldeten Kundin }, "422": { content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } }, description: Betrag nicht größer als 0 oder übersteigt den verfügbaren Betrag des Girokontos } }, summary: Überweisung vom Girokonto ausführen, tags: [ Überweisung ], x-use-cases: [ UC-002 ] } } }
components:
  schemas:
    Fehler:
      properties:
        fehler:
          type: string
      required:
        - fehler
      type: object
    Konto:
      properties:
        art:
          enum:
            - Girokonto
            - Kreditkarte
          type: string
        dispositionsrahmen:
          description: Dispositionsrahmen in Euro; nur beim Girokonto vorhanden
          type: number
        iban:
          description: IBAN des Kontos
          type: string
        kontoname:
          description: Bezeichnung des Kontos
          type: string
        saldo:
          description: Saldo in Euro; negativ bei einer Kreditkarte mit offenem Betrag
          type: number
        waehrung:
          enum:
            - EUR
          type: string
        verfuegbarerBetrag:
          type: number
          description: Verfügbarer Betrag in Euro (Saldo plus Dispositionsrahmen); nur beim Girokonto vorhanden
      required:
        - kontoname
        - iban
        - art
        - saldo
        - waehrung
      type: object
      x-entity: Konto
    Kontenuebersicht:
      properties:
        gesamtvermoegen:
          description: Summe der Salden aller Konten in Euro
          type: number
        konten:
          items:
            $ref: '#/components/schemas/Konto'
          type: array
      required:
        - konten
        - gesamtvermoegen
      type: object
    Ueberweisung:
      properties:
        auftragsId:
          type: string
        auftraggeberIban:
          type: string
        betrag:
          type: number
        empfaenger:
          type: string
        empfaengerIban:
          type: string
        erfasstAm:
          format: date-time
          type: string
        status:
          enum:
            - ausgefuehrt
          type: string
        verwendungszweck:
          type: string
        waehrung:
          enum:
            - EUR
          type: string
      required:
        - auftragsId
        - betrag
        - waehrung
        - status
        - erfasstAm
      type: object
      x-entity: Überweisung
    Ueberweisungsauftrag:
      properties:
        auftraggeberIban:
          description: IBAN des Girokontos der Kundin
          maxLength: 22
          minLength: 22
          type: string
        auftragsId:
          description: Kennung des Auftrags, von der Seite je Überweisung vergeben; wiederholte Bestätigung mit derselben Kennung bucht nicht erneut
          maxLength: 36
          minLength: 1
          type: string
        betrag:
          description: Betrag in Euro; höchstens der verfügbare Betrag des Girokontos
          exclusiveMinimum: 0
          type: number
        empfaenger:
          maxLength: 70
          minLength: 1
          type: string
        empfaengerIban:
          description: IBAN des Empfängers; Länderkennzeichen muss in der SEPA-Länderliste stehen
          maxLength: 34
          minLength: 15
          type: string
        verwendungszweck:
          maxLength: 140
          minLength: 1
          type: string
        waehrung:
          default: EUR
          enum:
            - EUR
          type: string
      required:
        - auftragsId
        - auftraggeberIban
        - empfaenger
        - empfaengerIban
        - betrag
        - verwendungszweck
      type: object
