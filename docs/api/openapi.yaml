openapi: 3.1.0
info:
  title: Online-Banking
  version: 0.1.0
paths:
  /api/konten:
    get:
      description: "Liefert die Konten der angemeldeten Kundin für den Finanzstatus. Ohne gültige Sitzung antwortet der Dienst mit 401; die Seite selbst leitet auf die Anmeldeseite um. Beträge in Euro, negative Salden (Kreditkarte mit offenem Betrag) als negative Zahl. Dispositionsrahmen und verfügbarer Betrag nur beim Girokonto."
      operationId: kontenLesen
      responses:
        "200":
          content: { application/json: { schema: { $ref: '#/components/schemas/Kontenuebersicht' } } }
          description: Konten der Kundin mit Gesamtvermögen
        "401":
          content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } }
          description: Keine gültige Sitzung
        "500":
          content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } }
          description: Datenfehler; ein Girokonto ohne Dispositionsrahmen
      summary: Konten der angemeldeten Kundin mit Salden und Gesamtvermögen
      tags: [ Finanzstatus ]
      x-use-cases: [ UC-001 ]
  /api/ueberweisungen:
    post:
      description: "Legt den Überweisungsauftrag an und führt ihn genau einmal aus. Die IBAN des Empfängers muss gültig sein und zu einem SEPA-Land gehören, der Betrag muss mindestens 0,10 Euro betragen und darf den verfügbaren Betrag des Girokontos nicht übersteigen; sonst wird nichts gebucht. Das Auftraggeberkonto ist ein Girokonto der angemeldeten Kundin. Eine wiederholte Bestätigung mit derselben auftragsId bucht nicht erneut; die auftragsId gilt je Kundin, dieselbe Kennung einer anderen Kundin ist ein eigener Auftrag. Lastkunden im Testbetrieb: Der Dienst merkt sich je Kundin nur die jüngsten 200 auftragsIds. Beträge in Euro."
      operationId: ueberweisungAusfuehren
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/Ueberweisungsauftrag' } } }
        required: true
      responses:
        "200":
          content: { application/json: { schema: { $ref: '#/components/schemas/Ueberweisung' } } }
          description: Auftrag mit dieser auftragsId war bereits ausgeführt; keine weitere Buchung
        "201":
          content: { application/json: { schema: { $ref: '#/components/schemas/Ueberweisung' } } }
          description: "Auftrag ausgeführt, Saldo des Girokontos gemindert"
        "400":
          content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } }
          description: "IBAN ungültig oder gehört zu keinem SEPA-Land, oder Betrag kleiner als 0,10 Euro"
        "401":
          content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } }
          description: Keine gültige Sitzung
        "403":
          content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } }
          description: Auftraggeberkonto gehört nicht zu einem Girokonto der angemeldeten Kundin
        "422":
          content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } }
          description: Betrag übersteigt den verfügbaren Betrag des Girokontos
      summary: Überweisung vom Girokonto ausführen
      tags: [ Überweisung ]
      x-use-cases: [ UC-002 ]
  "/api/konten/{iban}/umsaetze":
    get:
      description: "Liefert die Umsätze des Kontos mit dieser IBAN, den neuesten zuerst (BR-0008): sortiert nach Buchungstag absteigend, bei gleichem Buchungstag nach gebuchtAm absteigend. Ohne gültige Sitzung antwortet der Dienst mit 401; eine IBAN, die zu keinem Konto der angemeldeten Kundin gehört, mit 404 (BR-0011). Beträge in Euro, Ausgänge als negative Zahl. Suche und Filter wertet der Dienst aus: suchtext trifft Gegenpartei oder Verwendungszweck ohne Rücksicht auf Groß- und Kleinschreibung, von und bis begrenzen den Buchungstag, beide Grenzen eingeschlossen, richtung wählt Ein- oder Ausgang nach dem Vorzeichen des Betrags; ein fehlender Parameter schränkt nicht ein (BR-0009, BR-0010). Liegt von nach dem bis, antwortet der Dienst mit 400 und dem Feld fehler „Der Zeitraum ist ungültig: von liegt nach bis.“ und liefert keine Umsätze (BR-0010). Jeder Umsatz trägt seine umsatzId sowie sepaLastschrift und zurueckgegeben; daran bietet die Seite die Rückgabe einer SEPA-Lastschrift an (UC-022). Lastkunden im Testbetrieb: Der Dienst hält je Konto nur die jüngsten 200 Umsätze."
      operationId: umsaetzeLesen
      parameters:
        - description: IBAN des Kontos der Kundin
          in: path
          name: iban
          required: true
          schema: { type: string }
        - description: "Nur Umsätze, deren Gegenpartei oder Verwendungszweck den Suchtext enthält, ohne Rücksicht auf Groß- und Kleinschreibung (BR-0010)"
          in: query
          name: suchtext
          required: false
          schema: { type: string }
        - description: "Nur Umsätze mit Buchungstag ab diesem Tag, einschließlich (BR-0010); liegt dieser Tag nach dem Bis-Datum, antwortet der Dienst mit 400"
          in: query
          name: von
          required: false
          schema: { format: date, type: string }
        - description: "Nur Umsätze mit Buchungstag bis zu diesem Tag, einschließlich (BR-0010)"
          in: query
          name: bis
          required: false
          schema: { format: date, type: string }
        - description: Nur Umsätze mit positivem (eingang) oder negativem (ausgang) Betrag; alle schränkt nicht ein (BR-0009)
          in: query
          name: richtung
          required: false
          schema: { default: alle, enum: [ alle, eingang, ausgang ], type: string }
      responses:
        "200":
          content: { application/json: { schema: { $ref: '#/components/schemas/Umsaetze' } } }
          description: "Umsätze des Kontos, neueste zuerst, nach den Abfrageparametern gefiltert"
        "400":
          content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } }
          description: "Abfrageparameter ungültig, etwa ein Datum nicht im Format JJJJ-MM-TT, eine unbekannte Richtung oder ein Von-Datum nach dem Bis-Datum (BR-0010)"
        "401":
          content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } }
          description: Keine gültige Sitzung
        "404":
          content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } }
          description: Die IBAN gehört zu keinem Konto der Kundin
      summary: "Umsätze eines Kontos mit Saldo danach, neueste zuerst"
      tags: [ Finanzstatus ]
      x-use-cases: [ UC-003 ]
  /api/empfaengervorlagen:
    get:
      summary: Empfängervorlagen der angemeldeten Kundin
      description: "Liefert die Empfängervorlagen der angemeldeten Kundin, nach Name aufsteigend. Ohne gültige Sitzung antwortet der Dienst mit 401; die Seite selbst leitet auf die Anmeldeseite um. Der Verwendungszweck fehlt, wenn die Vorlage keinen hat."
      operationId: empfaengervorlagenAuflisten
      tags: [ Überweisung ]
      responses:
        "200":
          description: "Empfängervorlagen der Kundin, nach Name aufsteigend"
          content:
            application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Empfaengervorlage' } } }
        "401":
          description: Keine gültige Sitzung
          content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } }
      x-use-cases: [ UC-004 ]
    post:
      summary: Empfängervorlage anlegen
      description: "Legt eine Empfängervorlage der angemeldeten Kundin an. Der Name ist Pflicht und je Kundin eindeutig, die IBAN muss gültig sein und zu einem SEPA-Land gehören (BR-0003), der Verwendungszweck ist optional; ist er leer oder enthält er nur Leerzeichen, speichert der Dienst keinen Wert und das Feld verwendungszweck fehlt in der Antwort und in der Liste; eine Kundin hat höchstens 50 Empfängervorlagen. Den Namen vergleicht der Dienst auf Eindeutigkeit ohne führende und folgende Leerzeichen und ohne Beachtung der Groß-/Kleinschreibung; gespeichert und angezeigt wird die Eingabe der Kundin. Ohne gültige Sitzung antwortet der Dienst mit 401. Danach prüft er in dieser Reihenfolge: Pflicht und Format (400), die Eindeutigkeit des Namens (409), zuletzt die Höchstzahl (422); ein vergebener Name ergibt auch bei 50 Vorlagen 409 mit „Eine Vorlage mit diesem Namen gibt es bereits.“"
      operationId: empfaengervorlageAnlegen
      tags: [ Überweisung ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/NeueEmpfaengervorlage' } } }
      responses:
        "201":
          description: Vorlage angelegt
          content: { application/json: { schema: { $ref: '#/components/schemas/Empfaengervorlage' } } }
        "400":
          description: "Name fehlt oder ist länger als 70 Zeichen, Verwendungszweck länger als 140 Zeichen, IBAN ungültig oder gehört zu keinem SEPA-Land; wird vor der Eindeutigkeit und der Höchstzahl geprüft"
          content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } }
        "401":
          description: Keine gültige Sitzung
          content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } }
        "409":
          description: "Eine Vorlage mit diesem Namen gibt es bei dieser Kundin bereits, auch wenn sich der Name nur in der Groß-/Kleinschreibung oder in führenden oder folgenden Leerzeichen unterscheidet; die bestehende Vorlage bleibt unverändert. Wird vor der Höchstzahl geprüft, gilt also auch, wenn die Kundin schon 50 Vorlagen hat"
          content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } }
        "422":
          description: "Höchstzahl von 50 Empfängervorlagen erreicht; bestehende Vorlagen bleiben unverändert. Wird zuletzt geprüft, nur wenn Pflicht, Format und Eindeutigkeit in Ordnung sind"
          content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } }
      x-use-cases: [ UC-004 ]
  "/api/empfaengervorlagen/{vorlagenId}":
    patch:
      summary: Empfängervorlage umbenennen
      description: "Ändert nur den Namen der Vorlage; IBAN des Empfängers und Verwendungszweck bleiben. Der neue Name ist Pflicht und je Kundin eindeutig; die Eindeutigkeitsprüfung schließt die umbenannte Vorlage selbst aus, sodass ein Name, den die Vorlage nach dem Vergleich schon trägt, kein Konflikt ist und der Dienst mit 200 antwortet. Den Namen vergleicht der Dienst auch hier ohne führende und folgende Leerzeichen und ohne Beachtung der Groß-/Kleinschreibung; gespeichert und angezeigt wird die Eingabe der Kundin. Eine unbekannte Vorlagen-Kennung oder eine Vorlage einer anderen Kundin beantwortet der Dienst mit 404, ohne gültige Sitzung mit 401."
      operationId: empfaengervorlageUmbenennen
      tags: [ Überweisung ]
      parameters:
        - name: vorlagenId
          in: path
          required: true
          description: Kennung der Empfängervorlage
          schema: { type: string, minLength: 1, maxLength: 36 }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EmpfaengervorlageName' } } }
      responses:
        "200":
          description: "Vorlage umbenannt; gespeichert und angezeigt wird die Eingabe der Kundin"
          content: { application/json: { schema: { $ref: '#/components/schemas/Empfaengervorlage' } } }
        "400":
          description: Name fehlt oder ist länger als 70 Zeichen
          content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } }
        "401":
          description: Keine gültige Sitzung
          content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } }
        "404":
          description: Keine Vorlage der Kundin mit dieser Kennung
          content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } }
        "409":
          description: "Eine andere Vorlage mit diesem Namen gibt es bei dieser Kundin bereits, auch wenn sich der Name nur in der Groß-/Kleinschreibung oder in führenden oder folgenden Leerzeichen unterscheidet; die bestehende Vorlage bleibt unverändert"
          content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } }
      x-use-cases: [ UC-004 ]
    delete:
      summary: Empfängervorlage löschen
      description: "Löscht die Empfängervorlage der angemeldeten Kundin; eine bereits bestätigte Überweisung bleibt unberührt. Eine unbekannte Vorlagen-Kennung oder eine Vorlage einer anderen Kundin beantwortet der Dienst mit 404, ohne gültige Sitzung mit 401."
      operationId: empfaengervorlageLoeschen
      tags: [ Überweisung ]
      parameters:
        - name: vorlagenId
          in: path
          required: true
          description: Kennung der Empfängervorlage
          schema: { type: string, minLength: 1, maxLength: 36 }
      responses:
        "204": { description: Vorlage gelöscht }
        "401":
          description: Keine gültige Sitzung
          content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } }
        "404":
          description: Keine Vorlage der Kundin mit dieser Kennung
          content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } }
      x-use-cases: [ UC-004 ]
  /api/anmeldung:
    post:
      summary: Anmelden mit Kennung und PIN
      description: "Prüft Kennung und PIN gegen die Demo-Kunden (C-001), im Testbetrieb auch gegen die Lastkunden lasttest-001 bis lasttest-300. Die Kennung zählt ohne führende und folgende Leerzeichen und ohne Groß-/Kleinschreibung. Passt beides, legt der Dienst eine Sitzung an und setzt das Cookie aventa_sitzung (HttpOnly, SameSite Lax, Pfad /); alle geschützten Seiten und Endpunkte finden die Kundin über dieses Cookie. Eine unbekannte Kennung und eine falsche PIN beantwortet der Dienst gleich mit 401, ohne zu sagen, was nicht stimmt."
      operationId: anmelden
      tags: [ Anmeldung ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Anmeldedaten' } } }
      responses:
        "200":
          description: "Angemeldet; Sitzung angelegt"
          headers:
            Set-Cookie:
              description: "aventa_sitzung=<Sitzungskennung>; Path=/; HttpOnly; SameSite=Lax"
              schema: { type: string }
          content: { application/json: { schema: { $ref: '#/components/schemas/Angemeldet' } } }
        "401":
          description: Kennung unbekannt oder PIN falsch; Meldung „Kennung oder PIN ist falsch.“
          content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } }
  /api/abmeldung:
    post:
      summary: Abmelden
      description: "Beendet die Sitzung aus dem Cookie aventa_sitzung und löscht das Cookie. Antwortet auch ohne oder mit abgelaufener Sitzung mit 204."
      operationId: abmelden
      tags: [ Anmeldung ]
      responses: { "204": { description: Sitzung beendet, Cookie gelöscht } }
  /api/sitzung:
    get:
      summary: Angemeldete Kundin
      description: "Liefert Name und Kundennummer der angemeldeten Kundin für den Rahmen der Oberfläche. Ohne gültige Sitzung antwortet der Dienst mit 401."
      operationId: sitzungLesen
      tags: [ Anmeldung ]
      responses:
        "200":
          description: Die angemeldete Kundin
          content: { application/json: { schema: { $ref: '#/components/schemas/Sitzung' } } }
        "401":
          description: Keine gültige Sitzung
          content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } }
  /api/test/reset:
    post:
      summary: Demo-Testdaten zurücksetzen (nur Testbetrieb)
      description: "Nur im Testbetrieb (TEST_MODE=1) vorhanden, sonst antwortet der Dienst mit 404. Beendet die Sitzungen der Demo-Kundinnen und setzt deren Konten, Umsätze, Empfängervorlagen und Tageslimit auf den Ausgangsstand (Tageslimit gleich Standardlimit); ausgeführte Aufträge der Demo-Kundinnen sind vergessen. Lastkunden (lasttest-…) mit ihren Konten, Umsätzen, Aufträgen und Sitzungen bleiben unberührt. Ohne Anmeldung aufrufbar."
      operationId: testdatenZuruecksetzen
      tags: [ Testbetrieb ]
      x-testbetrieb: true
      responses: { "204": { description: Demo-Testdaten zurückgesetzt } }
  /api/test/lasttest/reset:
    post:
      summary: Lastdaten zurücksetzen (nur Testbetrieb)
      description: "Nur im Testbetrieb (TEST_MODE=1) vorhanden, sonst antwortet der Dienst mit 404. Beendet die Sitzungen der Lastkunden lasttest-001 bis lasttest-300 und setzt ihre Girokonten auf den Ausgangsstand (Saldo 10.000 Euro, Dispositionsrahmen 1.000 Euro, keine Umsätze) und ihr Tageslimit auf das Standardlimit; ihre ausgeführten Aufträge und Empfängervorlagen sind vergessen. Demo-Kundinnen bleiben unberührt. Ohne Anmeldung aufrufbar."
      operationId: lastdatenZuruecksetzen
      tags: [ Testbetrieb ]
      x-testbetrieb: true
      responses: { "204": { description: Lastdaten zurückgesetzt } }
  /api/tageslimit:
    get:
      summary: Tageslimit der angemeldeten Kundin
      description: Liefert das aktuelle Tageslimit der angemeldeten Kundin für Überweisungen je Kalendertag und das Standardlimit. Beträge in Euro. Ohne gültige Sitzung 401.
      operationId: tageslimitLesen
      tags:
        - Überweisung
      x-use-cases:
        - UC-015
      responses:
        "200":
          description: Aktuelles Tageslimit und Standardlimit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tageslimit'
        "401":
          description: Keine gültige Sitzung
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fehler'
    put:
      summary: Tageslimit der angemeldeten Kundin setzen
      description: Setzt das Tageslimit der angemeldeten Kundin für Überweisungen je Kalendertag auf den Betrag im Auftrag, von 0 bis zum Standardlimit; 0 sperrt alle Überweisungen. Das Limit gilt ab der nächsten Überweisung. Beträge in Euro. Ohne gültige Sitzung 401.
      operationId: tageslimitSetzen
      tags:
        - Überweisung
      x-use-cases:
        - UC-015
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tageslimitauftrag'
      responses:
        "200":
          description: Tageslimit gespeichert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tageslimit'
        "400":
          description: Tageslimit fehlt, ist keine Zahl, kleiner als 0, größer als das Standardlimit oder hat mehr als zwei Nachkommastellen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fehler'
        "401":
          description: Keine gültige Sitzung
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fehler'
  /api/konten/{iban}/umsaetze/{umsatzId}/rueckgaben:
    post:
      summary: Lastschrift zurückgeben und Betrag gutschreiben
      description: Gibt die SEPA-Lastschrift mit dieser umsatzId auf dem Girokonto mit dieser IBAN zurück und schreibt den Betrag gut (BR-0095). Eine umsatzId, die die Feldbedingung des Datenmodells verletzt (Länge 1 bis 36), beantwortet der Dienst mit 400. Ohne gültige Sitzung antwortet der Dienst mit 401; eine IBAN, die zu keinem Konto der angemeldeten Kundin gehört, mit 404 (BR-0011), eine unbekannte umsatzId mit 404 (BR-0094). Ist der Umsatz keine SEPA-Lastschrift oder schon zurückgegeben, antwortet er mit 422 (BR-0094), liegt der Buchungstag mehr als 56 Tage zurück, mit 422 (BR-0093); es wird nichts gebucht. Eine zweite Rückgabe derselben Lastschrift bucht nicht erneut. Beträge in Euro.
      operationId: lastschriftZurueckgeben
      tags:
        - Finanzstatus
      x-use-cases:
        - UC-022
      parameters:
        - name: iban
          in: path
          required: true
          description: IBAN des Girokontos der Kundin
          schema:
            type: string
        - name: umsatzId
          in: path
          required: true
          description: Kennung der SEPA-Lastschrift
          schema:
            type: string
            minLength: 1
            maxLength: 36
      responses:
        "201":
          description: Lastschrift zurückgegeben, Betrag gutgeschrieben
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rueckgabe'
        "400":
          description: Die umsatzId verletzt die Feldbedingung (Länge 1 bis 36)
          x-rules:
            - Umsatz.umsatzId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fehler'
        "401":
          description: Keine gültige Sitzung
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fehler'
        "404":
          description: Die IBAN gehört zu keinem Konto der Kundin oder das Konto hat keinen Umsatz mit dieser Kennung
          x-rules:
            - BR-0011
            - BR-0094
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fehler'
        "422":
          description: Der Umsatz ist keine SEPA-Lastschrift, die Lastschrift ist schon zurückgegeben oder die Rückgabefrist von 8 Wochen ist abgelaufen
          x-rules:
            - BR-0093
            - BR-0094
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fehler'
components:
  schemas:
    Anmeldedaten:
      type: object
      properties:
        kennung:
          description: Kennung der Kundin, etwa lena.hoffmann; ohne Rücksicht auf führende und folgende Leerzeichen und Groß-/Kleinschreibung
          type: string
        pin:
          description: Fünfstellige PIN
          type: string
      required:
        - kennung
        - pin
    Angemeldet:
      type: object
      properties:
        name:
          description: Vor- und Nachname der angemeldeten Kundin
          type: string
      required:
        - name
    Sitzung:
      type: object
      properties:
        vorname:
          type: string
        nachname:
          type: string
        kundennummer:
          type: string
      required:
        - vorname
        - nachname
        - kundennummer
    Fehler:
      properties:
        fehler:
          type: string
      required:
        - fehler
      type: object
    Konto:
      properties:
        art:
          enum:
            - Girokonto
            - Kreditkarte
          type: string
        dispositionsrahmen:
          description: Dispositionsrahmen in Euro; nur beim Girokonto vorhanden
          type: number
        iban:
          description: IBAN des Kontos
          type: string
        kontoname:
          description: Bezeichnung des Kontos
          type: string
        saldo:
          description: Saldo in Euro; negativ bei einer Kreditkarte mit offenem Betrag
          type: number
        waehrung:
          enum:
            - EUR
          type: string
        verfuegbarerBetrag:
          type: number
          description: Verfügbarer Betrag in Euro (Saldo plus Dispositionsrahmen); nur beim Girokonto vorhanden
      required:
        - kontoname
        - iban
        - art
        - saldo
        - waehrung
      type: object
      x-entity: Konto
    Kontenuebersicht:
      properties:
        gesamtvermoegen:
          description: Summe der Salden aller Konten in Euro
          type: number
        konten:
          items:
            $ref: '#/components/schemas/Konto'
          type: array
      required:
        - konten
        - gesamtvermoegen
      type: object
    Ueberweisung:
      properties:
        auftragsId:
          type: string
        auftraggeberIban:
          type: string
        betrag:
          type: number
        empfaenger:
          type: string
        empfaengerIban:
          type: string
        erfasstAm:
          format: date-time
          type: string
        status:
          enum:
            - ausgefuehrt
          type: string
