openapi: 3.1.0
info:
  title: Online-Banking
  version: 0.1.0
paths: { /api/konten: { get: { description: "Liefert die Konten der angemeldeten Kundin für den Finanzstatus. Ohne gültige Sitzung antwortet der Dienst mit 401; die Seite selbst leitet auf die Anmeldeseite um. Beträge in Euro, negative Salden (Kreditkarte mit offenem Betrag) als negative Zahl. Dispositionsrahmen nur beim Girokonto.", operationId: kontenLesen, responses: { "200": { content: { application/json: { schema: { $ref: '#/components/schemas/Kontenuebersicht' } } }, description: Konten der Kundin mit Gesamtvermögen }, "401": { content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } }, description: Keine gültige Sitzung } }, summary: Konten der angemeldeten Kundin mit Salden und Gesamtvermögen, tags: [ Finanzstatus ], x-use-cases: [ UC-001 ] } } }
components:
  schemas:
    Fehler:
      properties:
        fehler:
          type: string
      required:
        - fehler
      type: object
    Konto:
      properties:
        art:
          enum:
            - Girokonto
            - Kreditkarte
          type: string
        dispositionsrahmen:
          description: Dispositionsrahmen in Euro; nur beim Girokonto vorhanden
          type: number
        iban:
          description: IBAN des Kontos
          type: string
        kontoname:
          description: Bezeichnung des Kontos
          type: string
        saldo:
          description: Saldo in Euro; negativ bei einer Kreditkarte mit offenem Betrag
          type: number
        waehrung:
          enum:
            - EUR
          type: string
      required:
        - kontoname
        - iban
        - art
        - saldo
        - waehrung
      type: object
      x-entity: Konto
    Kontenuebersicht:
      properties:
        gesamtvermoegen:
          description: Summe der Salden aller Konten in Euro
          type: number
        konten:
          items:
            $ref: '#/components/schemas/Konto'
          type: array
      required:
        - konten
        - gesamtvermoegen
      type: object
