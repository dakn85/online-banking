              schema:
                $ref: "#/components/schemas/Fehler"
        "404":
          description: Die IBAN gehört zu keinem Konto der Kundin; wird nach dem Monat und vor der Kreditkarte geprüft
          x-rules:
            - BR-0084
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "422":
          description: Die IBAN gehört zu einer Kreditkarte; die Ausgabenanalyse gibt es nur für das Girokonto; wird zuletzt geprüft
          x-rules:
            - BR-0084
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
  /api/nachrichten:
    get:
      summary: Nachrichten der angemeldeten Kundin mit Zahl ungelesener
      description: Liefert die Nachrichten der angemeldeten Kundin, nach Datum absteigend (neueste zuerst), und die Zahl der ungelesenen Nachrichten. Ohne gültige Sitzung antwortet der Dienst mit 401; die Seite selbst leitet auf die Anmeldeseite um.
      operationId: nachrichtenAuflisten
      tags:
        - Postfach
      responses:
        "200":
          description: Nachrichten der Kundin, neueste zuerst, und Zahl ungelesener
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nachrichtenliste"
        "401":
          description: Keine gültige Sitzung
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
      x-use-cases:
        - UC-020
  /api/nachrichten/{nachrichtId}:
    patch:
      summary: Nachricht öffnen und als gelesen markieren
      description: "Öffnet die Nachricht der angemeldeten Kundin: setzt den Lesestatus auf gelesen und liefert die Nachricht mit ihrem Text. Der Aufruf braucht keinen Inhalt; bei einer schon gelesenen Nachricht ändert er nichts und antwortet ebenfalls mit 200. Eine Kennung außerhalb der Länge 1 bis 36 beantwortet der Dienst mit 400, eine wohlgeformte unbekannte Kennung oder eine Nachricht einer anderen Kundin mit 404, ohne gültige Sitzung mit 401."
      operationId: nachrichtOeffnen
      tags:
        - Postfach
      parameters:
        - name: nachrichtId
          in: path
          required: true
          description: Kennung der Nachricht
          schema:
            type: string
            minLength: 1
            maxLength: 36
      responses:
        "200":
          description: Nachricht mit Lesestatus gelesen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nachricht"
        "400":
          description: Kennung verletzt die Feldregeln
          x-rules:
            - Nachricht.nachrichtId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "401":
          description: Keine gültige Sitzung
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "404":
          description: Keine Nachricht der Kundin mit dieser Kennung
          x-rules:
            - BR-0085
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
      x-use-cases:
        - UC-020
    delete:
      summary: Nachricht löschen
      description: Löscht die Nachricht der angemeldeten Kundin endgültig; sie erscheint nicht mehr in der Liste und zählt nicht mehr als ungelesen. Eine Kennung außerhalb der Länge 1 bis 36 beantwortet der Dienst mit 400, eine wohlgeformte unbekannte Kennung oder eine Nachricht einer anderen Kundin mit 404, ohne gültige Sitzung mit 401.
      operationId: nachrichtLoeschen
      tags:
        - Postfach
      parameters:
        - name: nachrichtId
          in: path
          required: true
          description: Kennung der Nachricht
          schema:
            type: string
            minLength: 1
            maxLength: 36
      responses:
        "204":
          description: Nachricht gelöscht
        "400":
          description: Kennung verletzt die Feldregeln
          x-rules:
            - Nachricht.nachrichtId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "401":
          description: Keine gültige Sitzung
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "404":
          description: Keine Nachricht der Kundin mit dieser Kennung
          x-rules:
            - BR-0085
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
      x-use-cases:
        - UC-020
  /api/umbuchungen:
    post:
      description: "Legt die Umbuchung an und führt sie sofort genau einmal aus: Der Betrag wird vom Quellkonto abgezogen und dem Zielkonto gutgeschrieben, auf beiden Konten entsteht ein Umsatz. Quell- und Zielkonto gehören der angemeldeten Kundin und sind ein Girokonto und ein Tagesgeldkonto; der Betrag muss mindestens 0,10 Euro betragen und darf den verfügbaren Betrag des Quellkontos nicht übersteigen (Girokonto: Saldo plus Dispositionsrahmen, Tagesgeldkonto: Saldo); sonst wird nichts gebucht. Prüfreihenfolge: 401, 400 (Feldregeln inklusive Mindestbetrag), Wiederholung derselben auftragsId der Kundin (200 mit der ursprünglichen Umbuchung, ohne weitere Prüfung und ohne Buchung), 403, 422 BR-0088 (Kontenpaarung), 422 BR-0089 (Betragsgrenze); die erste Verletzung lehnt ab. Im Feld fehler steht bei 400 wegen des Mindestbetrags und bei 422 der Fachtext aus UC-021. Die auftragsId gilt je Kundin. Keine IBAN-Eingabe des Empfängers und keine TAN. Beträge in Euro."
      operationId: umbuchungAusfuehren
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Umbuchungsauftrag"
      responses:
        "200":
          description: Umbuchung mit dieser auftragsId war bereits ausgeführt; keine weitere Buchung, auch wenn Konten oder Betrag jetzt nicht mehr zulässig wären
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Umbuchung"
        "201":
          description: Umbuchung ausgeführt, Salden beider Konten verändert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Umbuchung"
        "400":
          description: Betrag kleiner als 0,10 Euro oder Feld verletzt die Feldregeln; bei zu kleinem Betrag steht in fehler „Der Betrag muss mindestens 0,10 € betragen.“
          x-rules:
            - Umbuchung.betrag
            - Umbuchung.quellIban
            - Umbuchung.zielIban
            - Umbuchung.auftragsId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "401":
          description: Keine gültige Sitzung
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "403":
          description: Quell- oder Zielkonto gehört nicht zur angemeldeten Kundin; wird vor 422 geprüft
          x-rules:
            - BR-0088
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "422":
          description: "Quell- und Zielkonto sind nicht ein Girokonto und ein Tagesgeldkonto oder dasselbe Konto (fehler: „Eine Umbuchung ist nur zwischen Girokonto und Tagesgeldkonto möglich.“), oder der Betrag übersteigt den verfügbaren Betrag des Quellkontos (fehler: „Der Betrag übersteigt den verfügbaren Betrag des Quellkontos.“); die Kontenpaarung wird vor der Betragsgrenze geprüft"
          x-rules:
            - BR-0088
            - BR-0089
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
      summary: Umbuchung zwischen eigenen Konten ausführen
      tags:
        - Überweisung
      x-use-cases:
        - UC-021
  /api/konten/{iban}/kontoauszug:
    get:
      summary: Kontoauszug eines Kontos für einen Monat als PDF
      description: "Erzeugt den Kontoauszug des Kontos mit dieser IBAN für den Kalendermonat monat als PDF und liefert ihn als Download (Content-Disposition attachment, Dateiname Kontoauszug_<IBAN ohne Leerzeichen>_<monat>.pdf). Das PDF enthält Anfangssaldo, Endsaldo und alle Umsätze des Monats, neueste zuerst; ein Monat ohne Umsätze ergibt einen leeren Auszug mit Saldo (BR-0098, BR-0008). Der Dienst prüft in dieser Reihenfolge: ohne gültige Sitzung 401; eine IBAN, die zu keinem Konto der angemeldeten Kundin gehört, 404 mit dem Feld fehler „Das Konto wurde nicht gefunden.“ (BR-0011 gilt auch für den Kontoauszug), ohne den Monat zu prüfen; ein Monat, der fehlt, nicht das Format JJJJ-MM hat oder nach dem laufenden Monat liegt, 400 mit dem Feld fehler „Der Monat ist ungültig: JJJJ-MM, höchstens der laufende Monat.“. Kann das PDF nicht erzeugt werden, antwortet der Dienst mit 500 und dem Feld fehler; die Maske zeigt dann unabhängig vom Text in fehler die Meldung „Der Kontoauszug konnte nicht erstellt werden. Bitte versuchen Sie es später erneut.“ und liefert keine Datei. Beträge in Euro, auf Cent gerundet (ADR-005)."
      operationId: kontoauszugErzeugen
      tags:
        - Finanzstatus
      x-use-cases:
        - UC-024
      parameters:
        - name: iban
          in: path
          required: true
          description: IBAN des Kontos der Kundin (Konto.iban); jede IBAN, die zu keinem Konto der Kundin gehört, ergibt 404
          schema:
            type: string
        - name: monat
          in: query
          required: true
          description: Kalendermonat des Auszugs, JJJJ-MM, höchstens der laufende Monat (Kontoauszug.monat)
          schema:
            type: string
            minLength: 7
            maxLength: 7
            pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
      responses:
        "200":
          description: Kontoauszug als PDF-Datei
          headers:
            Content-Disposition:
              description: attachment mit dem Dateinamen des Auszugs
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: Monat fehlt, hat nicht das Format JJJJ-MM oder liegt nach dem laufenden Monat; geprüft nach dem Konto
          x-rules:
            - Kontoauszug.monat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "401":
          description: Keine gültige Sitzung
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "404":
          description: Die IBAN gehört zu keinem Konto der Kundin; fehler lautet „Das Konto wurde nicht gefunden.“
          x-rules:
            - BR-0011
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "500":
          description: Das PDF konnte nicht erzeugt werden; fehler nennt den Fehler, die Maske zeigt unabhängig davon ihre eigene Meldung
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
components:
  schemas:
    Anmeldedaten:
      type: object
      properties:
        kennung:
          description: Kennung der Kundin, etwa lena.hoffmann; ohne Rücksicht auf führende und folgende Leerzeichen und Groß-/Kleinschreibung
          type: string
        pin:
          description: Fünfstellige PIN
          type: string
      required:
        - kennung
        - pin
    Angemeldet:
      type: object
      properties:
        name:
          description: Vor- und Nachname der angemeldeten Kundin
          type: string
      required:
        - name
    Sitzung:
      type: object
      properties:
        vorname:
          type: string
        nachname:
          type: string
        kundennummer:
          type: string
      required:
        - vorname
        - nachname
        - kundennummer
    Fehler:
      properties:
        fehler:
          type: string
      required:
        - fehler
      type: object
    Konto:
      properties:
        art:
          enum:
            - Girokonto
            - Kreditkarte
            - Tagesgeldkonto
          type: string
        dispositionsrahmen:
          description: Dispositionsrahmen in Euro; nur beim Girokonto vorhanden
          type: number
        iban:
          description: IBAN des Kontos
          type: string
          minLength: 22
          maxLength: 22
        kontoname:
          description: Bezeichnung des Kontos
          type: string
          minLength: 1
          maxLength: 60
        saldo:
          description: Saldo in Euro; negativ bei einer Kreditkarte mit offenem Betrag
          type: number
        waehrung:
          enum:
            - EUR
          type: string
        verfuegbarerBetrag:
          type: number
          description: Verfügbarer Betrag in Euro (Saldo plus Dispositionsrahmen); nur beim Girokonto vorhanden
      required:
        - kontoname
        - iban
        - art
        - saldo
        - waehrung
      type: object
      x-entity: Konto
    Kontenuebersicht:
      properties:
        gesamtvermoegen:
          description: Summe der Salden aller Konten in Euro
          type: number
        konten:
          items:
            $ref: '#/components/schemas/Konto'
          type: array
      required:
        - konten
        - gesamtvermoegen
      type: object
    Ueberweisung:
      properties:
        auftragsId:
          type: string
        auftraggeberIban:
          type: string
        betrag:
          type: number
        empfaenger:
          type: string
        empfaengerIban:
          type: string
        erfasstAm:
          format: date-time
          type: string
        status:
          enum:
            - ausgefuehrt
          type: string
        verwendungszweck:
          type: string
        waehrung:
          enum:
            - EUR
          type: string
      required:
        - auftragsId
        - betrag
        - waehrung
        - status
        - erfasstAm
      type: object
      x-entity: Überweisung
    Ueberweisungsauftrag:
      properties:
        auftraggeberIban:
          description: IBAN des Girokontos der Kundin
          maxLength: 22
          minLength: 22
          type: string
        auftragsId:
          description: Kennung des Auftrags, von der Seite je Überweisung vergeben; wiederholte Bestätigung mit derselben Kennung bucht nicht erneut
          maxLength: 36
          minLength: 1
          type: string
        betrag:
          description: Betrag in Euro, mindestens 0,10; höchstens der verfügbare Betrag des Girokontos
          type: number
          minimum: 0.1
        empfaenger:
          maxLength: 70
          minLength: 1
          type: string
        empfaengerIban:
          description: IBAN des Empfängers; Länderkennzeichen muss in der SEPA-Länderliste stehen
          maxLength: 34
          minLength: 15
          type: string
        verwendungszweck:
          maxLength: 140
          minLength: 1
          type: string
        waehrung:
          default: EUR
          enum:
            - EUR
          type: string
      required:
        - auftragsId
        - auftraggeberIban
        - empfaenger
        - empfaengerIban
        - betrag
        - verwendungszweck
      type: object
    Umsaetze:
      properties:
        umsaetze:
          items:
            $ref: '#/components/schemas/Umsatz'
          type: array
      required:
        - umsaetze
      type: object
    Rueckgabe:
      type: object
      properties:
        lastschriftUmsatzId:
          type: string
          description: Kennung der zurückgegebenen Lastschrift
        gutschrift:
          $ref: "#/components/schemas/Umsatz"
      required:
        - lastschriftUmsatzId
        - gutschrift

    Umsatz:
      properties:
        betrag:
          description: Betrag in Euro; beim Ausgang negativ
          type: number
        buchungstag:
          description: Tag der Buchung
          format: date
          type: string
        gegenpartei:
          description: Name der Gegenpartei
          type: string
          minLength: 1
          maxLength: 70
        saldoDanach:
          description: Saldo des Kontos nach dieser Buchung in Euro
          type: number
        verwendungszweck:
          description: Verwendungszweck der Buchung
          type: string
          minLength: 1
          maxLength: 140
        waehrung:
          enum:
            - EUR
          type: string
        gebuchtAm:
          description: Zeitpunkt der Buchung in UTC; bei gleichem Buchungstag der jüngere Umsatz zuerst (BR-0008)
          format: date-time
          type: string
        umsatzId:
          type: string
          description: Kennung des Umsatzes, vom Dienst vergeben
          minLength: 1
          maxLength: 36
        sepaLastschrift:
          type: boolean
          description: Der Umsatz ist eine SEPA-Lastschrift; nur das Girokonto trägt solche
        zurueckgegeben:
          type: boolean
          description: Die SEPA-Lastschrift wurde zurückgegeben (BR-0094)
        kategorie:
          description: Kategorie des Umsatzes aus der festen Liste
          enum:
            - Wohnen
            - Lebensmittel
            - Mobilität
            - Freizeit
            - Versicherungen
            - Gesundheit
            - Sonstiges
          type: string
      required:
        - umsatzId
        - buchungstag
        - gebuchtAm
        - gegenpartei
        - verwendungszweck
        - betrag
        - waehrung
        - saldoDanach
        - sepaLastschrift
        - zurueckgegeben
        - kategorie
      type: object
      x-entity: Umsatz
    Empfaengervorlage:
      type: object
      properties:
        vorlagenId:
          type: string
        name:
          description: Name des Empfängers, der zugleich die Vorlage benennt; gespeichert und angezeigt wie von der Kundin eingegeben
          maxLength: 70
          minLength: 1
          type: string
        empfaengerIban:
          description: IBAN des Empfängers; Länderkennzeichen muss in der SEPA-Länderliste stehen (BR-0003)
          maxLength: 34
          minLength: 15
          type: string
        verwendungszweck:
          description: Verwendungszweck der Vorlage; fehlt, wenn die Vorlage keinen hat, also leer oder nur Leerzeichen
          maxLength: 140
          type: string
      required:
        - vorlagenId
        - name
        - empfaengerIban
      x-entity: Empfaengervorlage
    NeueEmpfaengervorlage:
      type: object
      properties:
        name:
          description: Name des Empfängers, der zugleich die Vorlage benennt; je Kundin eindeutig, verglichen ohne führende und folgende Leerzeichen und ohne Beachtung der Groß-/Kleinschreibung; gespeichert und angezeigt wird die Eingabe der Kundin
          maxLength: 70
          minLength: 1
          type: string
        empfaengerIban:
          description: IBAN des Empfängers; Länderkennzeichen muss in der SEPA-Länderliste stehen (BR-0003)
          maxLength: 34
          minLength: 15
          type: string
        verwendungszweck:
          description: Verwendungszweck der Vorlage; optional; leer oder nur Leerzeichen bedeutet kein Verwendungszweck, dann speichert der Dienst keinen Wert und das Feld fehlt in der Antwort und in der Liste
          maxLength: 140
          type: string
      required:
        - name
        - empfaengerIban
    EmpfaengervorlageName:
      type: object
      properties:
        name:
          description: |-
            Neuer Name des Empfängers; je Kundin eindeutig, verglichen mit den anderen
                      Vorlagen der Kundin ohne führende und folgende Leerzeichen und ohne
                      Beachtung der Groß-/Kleinschreibung; der eigene Name der Vorlage ist
                      kein Konflikt; gespeichert und angezeigt wird die Eingabe der Kundin
          maxLength: 70
          minLength: 1
          type: string
      required:
        - name
    Tageslimit:
      type: object
      x-entity: Kunde
      properties:
        tageslimit:
          type: number
          description: Aktuelles Tageslimit in Euro
          minimum: 0
          maximum: 5000
          multipleOf: 0.01
        standardlimit:
          type: number
          description: Standardlimit in Euro, für alle Kundinnen gleich
      required:
        - tageslimit
        - standardlimit
    Tageslimitauftrag:
      type: object
      x-entity: Kunde
      properties:
        tageslimit:
          type: number
          description: Neues Tageslimit in Euro, von 0 bis zum Standardlimit
          minimum: 0
          maximum: 5000
          multipleOf: 0.01
      required:
        - tageslimit
    Dauerauftrag:
      type: object
      x-entity: Dauerauftrag
      properties:
        dauerauftragId:
          type: string
          minLength: 1
          maxLength: 36
        auftraggeberIban:
          type: string
          minLength: 15
          maxLength: 34
          description: IBAN des Girokontos der angemeldeten Kundin (BR-0007); setzt der Dienst
        empfaenger:
          type: string
          minLength: 1
          maxLength: 70
        empfaengerIban:
          type: string
          minLength: 15
          maxLength: 34
          description: IBAN des Empfängers; Länderkennzeichen muss in der SEPA-Länderliste stehen (BR-0003)
        betrag:
          type: number
          minimum: 0.1
          multipleOf: 0.01
        waehrung:
          type: string
          enum:
            - EUR
        verwendungszweck:
          type: string
          minLength: 1
          maxLength: 140
        turnus:
          type: string
          enum:
            - monatlich
            - vierteljährlich
            - jährlich
        ersterAusfuehrungstag:
          type: string
          format: date
        enddatum:
          type: string
          format: date
          description: Fehlt, wenn der Dauerauftrag kein Enddatum hat
      required:
        - dauerauftragId
        - auftraggeberIban
        - empfaenger
        - empfaengerIban
        - waehrung
        - betrag
        - verwendungszweck
        - turnus
        - ersterAusfuehrungstag
    NeuerDauerauftrag:
      type: object
      properties:
        empfaenger:
          type: string
          minLength: 1
          maxLength: 70
        empfaengerIban:
          type: string
          minLength: 15
          maxLength: 34
          description: IBAN des Empfängers; Länderkennzeichen muss in der SEPA-Länderliste stehen (BR-0003)
        betrag:
          type: number
          minimum: 0.1
          multipleOf: 0.01
          description: Höchstens zwei Nachkommastellen; mehr Nachkommastellen lehnt der Dienst mit 400 ab, er rundet nicht
        verwendungszweck:
          type: string
          minLength: 1
          maxLength: 140
        turnus:
          type: string
          enum:
            - monatlich
            - vierteljährlich
            - jährlich
        ersterAusfuehrungstag:
          type: string
          format: date
        enddatum:
          type: string
          format: date
          description: Optional; Prüfung gegen den ersten Ausführungstag nach BR-0077
      required:
        - empfaenger
        - empfaengerIban
        - betrag
        - verwendungszweck
        - turnus
        - ersterAusfuehrungstag
    Terminueberweisungsauftrag:
      type: object
