      required:
        - auftragsId
        - auftraggeberIban
        - empfaenger
        - empfaengerIban
        - betrag
        - verwendungszweck
        - ausfuehrungstag
      properties:
        auftragsId:
          type: string
          minLength: 1
          maxLength: 36
          description: Kennung des Auftrags, von der Seite je Überweisung vergeben; wiederholte Bestätigung mit derselben Kennung legt keinen weiteren Auftrag an
        auftraggeberIban:
          type: string
          minLength: 22
          maxLength: 22
          description: IBAN des Girokontos der Kundin
        empfaenger:
          type: string
          minLength: 1
          maxLength: 70
        empfaengerIban:
          type: string
          minLength: 15
          maxLength: 34
          description: IBAN des Empfängers; Länderkennzeichen muss in der SEPA-Länderliste stehen
        betrag:
          type: number
          minimum: 0.1
          description: Betrag in Euro, mindestens 0,10; höchstens der aktuelle verfügbare Betrag des Girokontos
        waehrung:
          type: string
          enum:
            - EUR
          default: EUR
        verwendungszweck:
          type: string
          minLength: 1
          maxLength: 140
        ausfuehrungstag:
