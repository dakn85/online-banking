openapi: 3.1.0
info:
  title: Online-Banking
  version: 0.1.0
paths: { /api/konten: { get: { description: "Liefert die Konten der angemeldeten Kundin für den Finanzstatus. Ohne gültige Sitzung antwortet der Dienst mit 401; die Seite selbst leitet auf die Anmeldeseite um. Beträge in Euro, negative Salden (Kreditkarte mit offenem Betrag) als negative Zahl. Dispositionsrahmen und verfügbarer Betrag nur beim Girokonto.", operationId: kontenLesen, responses: { "200": { content: { application/json: { schema: { $ref: '#/components/schemas/Kontenuebersicht' } } }, description: Konten der Kundin mit Gesamtvermögen }, "401": { content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } }, description: Keine gültige Sitzung }, "500": { content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } }, description: Datenfehler; ein Girokonto ohne Dispositionsrahmen } }, summary: Konten der angemeldeten Kundin mit Salden und Gesamtvermögen, tags: [ Finanzstatus ], x-use-cases: [ UC-001 ] } }, /api/ueberweisungen: { post: { description: "Legt den Überweisungsauftrag an und führt ihn genau einmal aus. Die IBAN des Empfängers muss gültig sein und zu einem SEPA-Land gehören, der Betrag darf den verfügbaren Betrag des Girokontos nicht übersteigen; sonst wird nichts gebucht. Das Auftraggeberkonto ist ein Girokonto der angemeldeten Kundin. Eine wiederholte Bestätigung mit derselben auftragsId bucht nicht erneut. Beträge in Euro.", operationId: ueberweisungAusfuehren, requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Ueberweisungsauftrag' } } }, required: true }, responses: { "200": { content: { application/json: { schema: { $ref: '#/components/schemas/Ueberweisung' } } }, description: Auftrag mit dieser auftragsId war bereits ausgeführt; keine weitere Buchung }, "201": { content: { application/json: { schema: { $ref: '#/components/schemas/Ueberweisung' } } }, description: "Auftrag ausgeführt, Saldo des Girokontos gemindert" }, "400": { content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } }, description: "IBAN ungültig oder gehört zu keinem SEPA-Land" }, "401": { content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } }, description: Keine gültige Sitzung }, "403": { content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } }, description: Auftraggeberkonto gehört nicht zu einem Girokonto der angemeldeten Kundin }, "422": { content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } }, description: Betrag nicht größer als 0 oder übersteigt den verfügbaren Betrag des Girokontos } }, summary: Überweisung vom Girokonto ausführen, tags: [ Überweisung ], x-use-cases: [ UC-002 ] } }, /api/empfaengervorlagen: { get: { summary: Empfängervorlagen der angemeldeten Kundin, description: "Liefert die Empfängervorlagen der angemeldeten Kundin, nach Name aufsteigend. Ohne gültige Sitzung antwortet der Dienst mit 401; die Seite selbst leitet auf die Anmeldeseite um. Der Verwendungszweck fehlt, wenn die Vorlage keinen hat.", operationId: empfaengervorlagenAuflisten, tags: [ Überweisung ], responses: { "200": { description: "Empfängervorlagen der Kundin, nach Name aufsteigend", content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Empfaengervorlage' } } } } }, "401": { description: Keine gültige Sitzung, content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } } } }, x-use-cases: [ UC-004 ] }, post: { summary: Empfängervorlage anlegen, description: "Legt eine Empfängervorlage der angemeldeten Kundin an. Der Name ist Pflicht und je Kundin eindeutig, die IBAN muss gültig sein und zu einem SEPA-Land gehören (BR-0003), der Verwendungszweck ist optional, eine Kundin hat höchstens 50 Empfängervorlagen. Den Namen vergleicht der Dienst auf Eindeutigkeit ohne führende und folgende Leerzeichen und ohne Beachtung der Groß-/Kleinschreibung; gespeichert und angezeigt wird die Eingabe der Kundin. Ohne gültige Sitzung antwortet der Dienst mit 401.", operationId: empfaengervorlageAnlegen, tags: [ Überweisung ], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NeueEmpfaengervorlage' } } } }, responses: { "201": { description: Vorlage angelegt, content: { application/json: { schema: { $ref: '#/components/schemas/Empfaengervorlage' } } } }, "400": { description: "Name fehlt oder ist länger als 70 Zeichen, Verwendungszweck länger als 140 Zeichen, IBAN ungültig oder gehört zu keinem SEPA-Land", content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } } }, "401": { description: Keine gültige Sitzung, content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } } }, "409": { description: "Eine Vorlage mit diesem Namen gibt es bei dieser Kundin bereits, auch wenn sich der Name nur in der Groß-/Kleinschreibung oder in führenden oder folgenden Leerzeichen unterscheidet; die bestehende Vorlage bleibt unverändert", content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } } }, "422": { description: Höchstzahl von 50 Empfängervorlagen erreicht; bestehende Vorlagen bleiben unverändert, content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } } } }, x-use-cases: [ UC-004 ] } }, "/api/empfaengervorlagen/{vorlagenId}": { patch: { summary: Empfängervorlage umbenennen, description: "Ändert nur den Namen der Vorlage; IBAN des Empfängers und Verwendungszweck bleiben. Der neue Name ist Pflicht und je Kundin eindeutig. Den Namen vergleicht der Dienst auch hier ohne führende und folgende Leerzeichen und ohne Beachtung der Groß-/Kleinschreibung; gespeichert und angezeigt wird die Eingabe der Kundin. Eine unbekannte Vorlagen-Kennung oder eine Vorlage einer anderen Kundin beantwortet der Dienst mit 404, ohne gültige Sitzung mit 401.", operationId: empfaengervorlageUmbenennen, tags: [ Überweisung ], parameters: [ { name: vorlagenId, in: path, required: true, description: Kennung der Empfängervorlage, schema: { type: string, minLength: 1, maxLength: 36 } } ], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EmpfaengervorlageName' } } } }, responses: { "200": { description: Vorlage umbenannt, content: { application/json: { schema: { $ref: '#/components/schemas/Empfaengervorlage' } } } }, "400": { description: Name fehlt oder ist länger als 70 Zeichen, content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } } }, "401": { description: Keine gültige Sitzung, content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } } }, "404": { description: Keine Vorlage der Kundin mit dieser Kennung, content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } } }, "409": { description: "Eine Vorlage mit diesem Namen gibt es bei dieser Kundin bereits, auch wenn sich der Name nur in der Groß-/Kleinschreibung oder in führenden oder folgenden Leerzeichen unterscheidet; die bestehende Vorlage bleibt unverändert", content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } } } }, x-use-cases: [ UC-004 ] }, delete: { summary: Empfängervorlage löschen, description: "Löscht die Empfängervorlage der angemeldeten Kundin; eine bereits bestätigte Überweisung bleibt unberührt. Eine unbekannte Vorlagen-Kennung oder eine Vorlage einer anderen Kundin beantwortet der Dienst mit 404, ohne gültige Sitzung mit 401.", operationId: empfaengervorlageLoeschen, tags: [ Überweisung ], parameters: [ { name: vorlagenId, in: path, required: true, description: Kennung der Empfängervorlage, schema: { type: string, minLength: 1, maxLength: 36 } } ], responses: { "204": { description: Vorlage gelöscht }, "401": { description: Keine gültige Sitzung, content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } } }, "404": { description: Keine Vorlage der Kundin mit dieser Kennung, content: { application/json: { schema: { $ref: '#/components/schemas/Fehler' } } } } }, x-use-cases: [ UC-004 ] } } }
components:
  schemas:
    Fehler:
      properties:
        fehler:
          type: string
      required:
        - fehler
      type: object
    Konto:
      properties:
        art:
          enum:
            - Girokonto
            - Kreditkarte
          type: string
        dispositionsrahmen:
          description: Dispositionsrahmen in Euro; nur beim Girokonto vorhanden
          type: number
        iban:
          description: IBAN des Kontos
          type: string
        kontoname:
          description: Bezeichnung des Kontos
          type: string
        saldo:
          description: Saldo in Euro; negativ bei einer Kreditkarte mit offenem Betrag
          type: number
        waehrung:
          enum:
            - EUR
          type: string
        verfuegbarerBetrag:
          type: number
          description: Verfügbarer Betrag in Euro (Saldo plus Dispositionsrahmen); nur beim Girokonto vorhanden
      required:
        - kontoname
        - iban
        - art
        - saldo
        - waehrung
      type: object
      x-entity: Konto
    Kontenuebersicht:
      properties:
        gesamtvermoegen:
          description: Summe der Salden aller Konten in Euro
          type: number
        konten:
          items:
            $ref: '#/components/schemas/Konto'
          type: array
      required:
        - konten
        - gesamtvermoegen
      type: object
    Ueberweisung:
      properties:
        auftragsId:
          type: string
        auftraggeberIban:
          type: string
        betrag:
          type: number
        empfaenger:
          type: string
        empfaengerIban:
          type: string
        erfasstAm:
          format: date-time
          type: string
        status:
          enum:
            - ausgefuehrt
          type: string
        verwendungszweck:
          type: string
        waehrung:
          enum:
            - EUR
          type: string
      required:
        - auftragsId
        - betrag
        - waehrung
        - status
        - erfasstAm
      type: object
      x-entity: Überweisung
    Ueberweisungsauftrag:
      properties:
        auftraggeberIban:
          description: IBAN des Girokontos der Kundin
          maxLength: 22
          minLength: 22
          type: string
        auftragsId:
          description: Kennung des Auftrags, von der Seite je Überweisung vergeben; wiederholte Bestätigung mit derselben Kennung bucht nicht erneut
          maxLength: 36
          minLength: 1
          type: string
        betrag:
          description: Betrag in Euro; höchstens der verfügbare Betrag des Girokontos
          exclusiveMinimum: 0
          type: number
        empfaenger:
          maxLength: 70
          minLength: 1
          type: string
        empfaengerIban:
          description: IBAN des Empfängers; Länderkennzeichen muss in der SEPA-Länderliste stehen
          maxLength: 34
          minLength: 15
          type: string
        verwendungszweck:
          maxLength: 140
          minLength: 1
          type: string
        waehrung:
          default: EUR
          enum:
            - EUR
          type: string
      required:
        - auftragsId
        - auftraggeberIban
        - empfaenger
        - empfaengerIban
        - betrag
        - verwendungszweck
      type: object
    Empfaengervorlage:
      type: object
      properties:
        vorlagenId:
          type: string
        name:
          description: Name des Empfängers, der zugleich die Vorlage benennt; gespeichert und angezeigt wie von der Kundin eingegeben
          maxLength: 70
          minLength: 1
          type: string
        empfaengerIban:
          description: IBAN des Empfängers; Länderkennzeichen muss in der SEPA-Länderliste stehen (BR-0003)
          maxLength: 34
          minLength: 15
          type: string
        verwendungszweck:
          description: Verwendungszweck der Vorlage; fehlt, wenn die Vorlage keinen hat
          maxLength: 140
          type: string
      required:
        - vorlagenId
        - name
        - empfaengerIban
      x-entity: Empfaengervorlage
    NeueEmpfaengervorlage:
      type: object
      properties:
        name:
          description: Name des Empfängers, der zugleich die Vorlage benennt; je Kundin eindeutig, verglichen ohne führende und folgende Leerzeichen und ohne Beachtung der Groß-/Kleinschreibung; gespeichert und angezeigt wird die Eingabe der Kundin
          maxLength: 70
          minLength: 1
          type: string
        empfaengerIban:
          description: IBAN des Empfängers; Länderkennzeichen muss in der SEPA-Länderliste stehen (BR-0003)
          maxLength: 34
          minLength: 15
          type: string
        verwendungszweck:
          description: Verwendungszweck der Vorlage; optional
          maxLength: 140
          type: string
      required:
        - name
        - empfaengerIban
    EmpfaengervorlageName:
      type: object
      properties:
        name:
          description: Neuer Name des Empfängers; je Kundin eindeutig, verglichen ohne führende und folgende Leerzeichen und ohne Beachtung der Groß-/Kleinschreibung; gespeichert und angezeigt wird die Eingabe der Kundin
          maxLength: 70
          minLength: 1
          type: string
      required:
        - name
